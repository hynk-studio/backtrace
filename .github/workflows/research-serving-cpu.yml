name: Inference-only serving deployment and lifecycle CPU qualification
on:
  push:
    branches: [bt-001-research-serving-lifecycle-20261025]
permissions:
  contents: read
concurrency:
  group: research-serving-cpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install read-only input SDK
        run: python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Linux suite and immutable protocol
        run: |
          set -euo pipefail
          mkdir -p evidence .local
          chmod 700 .local
          python_path="$(command -v python3)"
          sudo "$python_path" -m unittest discover -s tests -v > evidence/tests.log 2>&1
          python -m tools.research_comparison validate > evidence/protocol.json
          python tools/backtrace.py preflight > evidence/preflight.json
          git diff --check
      - name: Full serving closure, pinned SSH, isolated slots and independent cleanup
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python_path="$(command -v python3)"
          sudo --preserve-env=KAGGLE_API_TOKEN,GITHUB_SHA,GITHUB_RUN_ID "$python_path" -m tools.research_serving_cpu evidence/qualification
      - name: Hand public receipts and ciphertext to uploader
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-serving-public-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**/*.json
            evidence/tests.log
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-serving-private-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/**/*.age
          retention-days: 14
          if-no-files-found: error
