name: Nested startup process ownership diagnostic
on:
  push:
    branches: [bt-001-startup-reaper-diagnostic-20261023, bt-001-startup-reaper-fix-20261023]
    paths: ['tools/startup_guard.py', 'tests/official_startup_reaper.py', '.github/workflows/startup-reaper.yml']
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Real root parent and dropped-UID server ownership probe
        env:
          REAPER_EXPECT: ${{ github.ref_name == 'bt-001-startup-reaper-diagnostic-20261023' && 'orphan-error' || 'clean' }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python_path="$(command -v python)"
          sudo "$python_path" tests/official_startup_reaper.py --expect "$REAPER_EXPECT" | tee evidence/startup-reaper.json
      - name: Full actual Linux regression suite for the corrected owner
        if: github.ref_name == 'bt-001-startup-reaper-fix-20261023'
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          python tools/backtrace.py preflight | tee evidence/preflight.json
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-reaper-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
