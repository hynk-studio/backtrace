name: Small model independent read-only remote watcher
on:
  push:
    branches: [bt-001-small-model-provider-20261027]
permissions:
  contents: write
  actions: read
jobs:
  observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Independently observe provider and owner liveness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m tools.small_model_remote_watch watch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-provider-watch-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/*.json
          retention-days: 14
          if-no-files-found: error
