name: Research pilot owner requires fresh owner authorization
on:
  push:
    branches: [bt-001-research-reduced9-start-20261026]
permissions:
  contents: write
  actions: read
concurrency:
  group: research-reduced9-owner-20261026
  cancel-in-progress: false
jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Exact source and unconsumed explicit authorization gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p .local evidence
          chmod 700 .local
          python_path="$(command -v python3)"
          sudo --preserve-env=GITHUB_TOKEN,RUNPOD_API_KEY,KAGGLE_API_TOKEN,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF_NAME "$python_path" -m tools.research_entry_main owner
      - name: Hand receipts to uploader
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-owner-${{ github.run_id }}
          path: |
            evidence/**/*.json
            evidence/**/*.age
          retention-days: 14
          if-no-files-found: error
