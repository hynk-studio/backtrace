name: Bootstrap diagnostic independent cleanup
on:
  push:
    branches: [bt-001-a100-watch-bootstrap-probe]
permissions:
  contents: write
  actions: read
concurrency:
  group: bootstrap-probe-independent-cleanup-20261022
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Independently reconcile this exact diagnostic authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_TOKEN,RUNPOD_API_KEY,GITHUB_REPOSITORY,GITHUB_REF_NAME,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_SHA "$python_path" -m tools.bootstrap_probe watch
