name: Research entry full free qualification
on:
  push:
    branches: [bt-001-research-prepaid-entry-20261026]
permissions:
  contents: read
  actions: read
concurrency:
  group: research-entry-cpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned CPU owner libraries
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Linux suite, immutable experiment and preflight
        run: |
          set -euo pipefail
          mkdir -p evidence .local
          chmod 700 .local
          python_path="$(command -v python3)"
          sudo "$python_path" -m unittest discover -s tests -v > evidence/tests.log 2>&1
          python -m tools.research_comparison validate > evidence/protocol.json
          python tools/backtrace.py preflight > evidence/preflight.json
          git diff --check
      - name: Actual owner and watcher through HTTP replicas and full serving path
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python_path="$(command -v python3)"
          sudo --preserve-env=KAGGLE_API_TOKEN,GITHUB_SHA,GITHUB_RUN_ID "$python_path" -m tools.research_entry_cpu evidence/qualification
      - name: Verify two independent live GitHub state probe workflows
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.research_entry_probe verify
      - name: Fresh read-only account and quote
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m tools.research_entry_offer evidence/account-quote.json
      - name: Make public receipts and encrypted evidence available
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-entry-public-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**/*.json
            evidence/tests.log
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-entry-private-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/**/*.age
          retention-days: 14
          if-no-files-found: ignore
