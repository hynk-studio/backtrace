name: Offline provider problem evidence validation
on:
  push:
    branches: [bt-001-provider-error-evidence-20261101]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Full offline regression tests and preflight
        run: |
          set -euo pipefail
          mkdir -p evidence
          if ! command -v bwrap >/dev/null; then sudo apt-get update && sudo apt-get install -y bubblewrap; fi
          sudo "$(command -v python)" -m unittest discover -s tests -v > evidence/tests.log 2>&1
          python tools/backtrace.py preflight > evidence/preflight.json
          git diff --check
      - name: Retain full offline evidence in the job log
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,json,zipfile
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(Path('evidence').glob('*')):
                  if p.is_file() and p.stat().st_size<2*1024**2:archive.write(p,p.name)
          raw=stream.getvalue();encoded=base64.b64encode(raw).decode()
          print('TRAINABILITY_ARCHIVE_META '+json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
          for i in range(0,len(encoded),48000):print('TRAINABILITY_ARCHIVE_CHUNK '+str(i//48000)+' '+encoded[i:i+48000])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-error-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 14
