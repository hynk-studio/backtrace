name: Bootstrap probe read-only account and stock
on:
  push:
    branches: [bt-001-bootstrap-probe]
    paths: ['.github/workflows/bootstrap-probe-access.yml']
permissions:
  contents: read
concurrency:
  group: bootstrap-probe-read-only
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Read account, stock and recorded exact Pod without mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_TOKEN,RUNPOD_API_KEY,GITHUB_REPOSITORY,GITHUB_REF_NAME,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_SHA "$python_path" -m tools.bootstrap_probe access
