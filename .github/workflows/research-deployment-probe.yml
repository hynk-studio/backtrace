name: Free exact-image research deployment prerequisites
on:
  push:
    branches: [bt-001-research-deployment-probe-20261025]
permissions:
  contents: read
concurrency:
  group: research-deployment-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Full Linux suite and CPU preflight
        run: |
          mkdir -p evidence/deployment
          python_path="$(command -v python3)"
          sudo "$python_path" -m unittest discover -s tests -v > evidence/deployment/tests.log 2>&1
          python tools/backtrace.py preflight > evidence/deployment/preflight.json
      - name: Exact image and actual namespace prerequisites
        run: sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 -m tools.research_deployment_probe evidence/deployment/probe
      - name: Allow public receipt export
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/deployment/
          retention-days: 14
          if-no-files-found: error
