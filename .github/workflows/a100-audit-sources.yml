name: Free private harness source acquisition
on:
  push:
    branches: [bt-001-connected-qualification]
    paths: [tools/free_audit_sources.py, .github/workflows/a100-audit-sources.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Acquire exact existing harness inputs without running them
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -m tools.free_audit_sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-sources-${{ github.sha }}
          path: evidence/audit-sources.age
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
