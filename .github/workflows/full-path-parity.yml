name: Free full-path transport parity audit

on:
  push:
    branches: [bt-001-full-path-parity]
    paths: ['tools/**', 'tests/**', '.github/workflows/full-path-parity.yml']
permissions:
  contents: read
concurrency:
  group: full-path-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Prepare disk on this disposable free CPU runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install pinned controller libraries without service credentials
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Real image, pinned SSH, private transfer and remote envelopes
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID "$python_path" -m tests.official_full_path_parity
      - name: Expose only the projected public report and owner ciphertext
        if: always()
        run: |
          for file in evidence/full-path-parity.json evidence/full-path-parity-private.age; do
            if sudo test -f "$file"; then sudo chmod 0644 "$file"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-path-parity-${{ github.run_id }}
          path: evidence/full-path-parity.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-path-parity-private-${{ github.run_id }}
          path: evidence/full-path-parity-private.age
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
