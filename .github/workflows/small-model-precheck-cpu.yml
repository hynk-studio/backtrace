name: Small model pre-minimum lifecycle CPU qualification

on:
  push:
    branches: [bt-001-small-model-precheck-20261026]

permissions:
  contents: read

concurrency:
  group: small-model-precheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check native namespace boundary before expensive preparation
        run: |
          mkdir -p evidence .local
          if ! command -v bwrap >/dev/null; then sudo apt-get update && sudo apt-get install -y bubblewrap; fi
          python_path="$(command -v python3)"
          runtime_root="$(mktemp -d /tmp/backtrace-cpu-runtime-XXXXXX)"
          chmod 755 "$runtime_root"
          "$python_path" -m venv "$runtime_root"
          echo "BACKTRACE_CPU_RUNTIME=$runtime_root" >> "$GITHUB_ENV"
          sudo "$python_path" - "$runtime_root/bin/python" <<'PY' > evidence/early-boundary.json 2> evidence/early-boundary-stderr.log
          import json,sys
          from pathlib import Path
          from tools.small_model_runner_probe import boundary_probe
          root=Path('.local/runner-early').resolve(); root.mkdir(mode=0o700)
          for kind in ('sources','models'):
              (root/kind/'E2B').mkdir(mode=0o700,parents=True)
          print(json.dumps(boundary_probe(Path(sys.argv[1]),root/'sources',root/'models',root/'boundaries'),sort_keys=True))
          PY
      - name: Full native Linux suite and CPU preflight
        run: |
          set -euo pipefail
          mkdir -p evidence .local
          python_path="$(command -v python3)"
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          "$python_path" tools/backtrace.py preflight | tee evidence/preflight.json
          git diff --check
      - name: Install pinned CPU runtime and record isolation tool
        run: |
          sudo apt-get update > evidence/os-install.log 2>&1
          sudo apt-get install -y bubblewrap >> evidence/os-install.log 2>&1
          bwrap --version > evidence/bubblewrap-version.txt
          "$BACKTRACE_CPU_RUNTIME/bin/python" -m pip download --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r docs/small-model-cpu-requirements.txt -d .local/wheels > evidence/dependency-download.log 2>&1
          "$BACKTRACE_CPU_RUNTIME/bin/python" -m pip install --no-index --find-links .local/wheels --require-hashes -r docs/small-model-cpu-requirements.txt > evidence/dependency-install.log 2>&1
          "$BACKTRACE_CPU_RUNTIME/bin/python" -m pip check > evidence/dependency-check.txt
      - name: Reconstruct and verify original development inputs
        run: |
          python -m tools.small_model_readiness acquire .local/model-sources > evidence/source-acquisition.json
          python -m tools.small_model_readiness rebuild-packets .local/packets > evidence/packet-reconstruction.json
          HF_HUB_OFFLINE=1 "$BACKTRACE_CPU_RUNTIME/bin/python" -m tools.small_model_readiness tokenize .local/model-sources .local/packets .local/tokenization.json > evidence/tokenization-summary.json
          python -m tools.small_model_readiness prepare-scope .local/packets .local/tokenization.json .local/smoke --scope smoke > evidence/smoke-scope.json
      - name: Independent cleanup and connected CPU pipeline under the outer deadline
        run: |
          runtime_python="$BACKTRACE_CPU_RUNTIME/bin/python"
          sudo env HF_HUB_OFFLINE=1 TOKENIZERS_PARALLELISM=false "$runtime_python" -m tools.small_model_lifecycle_probe qualify .local/precheck-native --connected "$runtime_python" .local/model-sources .local/packets .local/tokenization.json .local/smoke > evidence/precheck-summary.json 2> evidence/precheck-stderr.log
      - name: Preserve bounded CPU evidence and partial failures
        if: always()
        run: |
          sudo python - <<'PYCODE'
          from pathlib import Path
          import shutil
          root=Path('.local/precheck-native')
          leaves={'receipt.json','failed.json','prepared.json','owner.json','watch.json','owner.log','watch.log','export.log','worker.log','result.json','owner-result.json','watcher-cleanup.json','work.export.json','recovery.json','collection.json','evaluation.json','assignment.json','ledger.jsonl','E2B-ready.json','E4B-ready.json','E2B-stderr.log','E4B-stderr.log'}
          for p in root.rglob('*'):
              if p.is_symlink() or any(x in ('random-models','private') for x in p.relative_to(root).parts):continue
              if p.is_file() and (p.name in leaves or p.parent==root) and p.stat().st_size<=16*1024*1024:
                  shutil.copyfile(p,Path('evidence')/('precheck-'+str(p.relative_to(root)).replace('/','-')))
          # These archives contain only the authored/random CPU qualification
          # outputs. Real hardware/model evidence is never auto-uploaded here.
          import hashlib,json
          for p in root.glob('*/work.tar'):
              manifest=p.with_suffix('.export.json')
              if not manifest.is_file():continue
              row=json.loads(manifest.read_bytes())
              if p.is_symlink() or p.stat().st_size>65*1024*1024:raise ValueError('CPU archive bounds')
              if hashlib.sha256(p.read_bytes()).hexdigest()!=row['sha256']:raise ValueError('CPU archive changed')
              shutil.copyfile(p,Path('evidence')/('cpu-export-'+p.parent.name+'.tar'))
          for p in Path('evidence').iterdir():p.chmod(0o644)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-model-precheck-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
