name: Qualified GPU read-only availability

on:
  push:
    branches: [bt-001-qualified-gpu-20261023]
    paths: ['.github/workflows/qualified-gpu-access.yml']
permissions:
  contents: read
concurrency:
  group: qualified-gpu-access-20261023
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned read-only controller libraries
        run: python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Read account and qualified A100 stock without allocation
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python - <<'PY'
          import json, logging, os
          from pathlib import Path
          from tools.cloud_offer import inspect_offer
          from tools import runpod_control as control
          from tools.cloud_probe import failure, secret
          logging.disable(logging.CRITICAL)
          report={'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'allocation_requests':0,'settings_changed':False}
          try:
              report['availability']=inspect_offer()
              pods=control.RunpodAPI(secret('RUNPOD_API_KEY')).list()
              report['pods']=[{k:p.get(k) for k in ('id','name','desiredStatus')} for p in pods]
              report['status']='PASS'
          except Exception as error:
              report.update(status='FAIL',failure=failure(error))
          root=Path('evidence');root.mkdir(exist_ok=True)
          (root/'qualified-gpu-access.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          raise SystemExit(0 if report['status']=='PASS' else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualified-gpu-access-${{ github.run_id }}
          path: evidence/qualified-gpu-access.json
          retention-days: 7
          if-no-files-found: error
