name: Bootstrap probe free qualification
on:
  push:
    branches: [bt-001-bootstrap-probe]
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/bootstrap-probe-*.yml'
      - '.github/workflows/a100-cpu.yml'
      - 'docs/cloud-controller-requirements.txt'
permissions:
  contents: read
concurrency:
  group: bootstrap-probe-free-qualification
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned controller dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Qualify host, exact image transport and concurrent cleanup without provider credentials
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_REF_NAME,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_SHA "$python_path" -m tools.bootstrap_probe qualify
      - name: Make projected report readable
        if: always()
        run: |
          sudo chmod 0755 evidence
          sudo chmod 0644 evidence/bootstrap-probe-qualify.json
          if sudo test -f evidence/bootstrap-qualification-private.age; then sudo chmod 0644 evidence/bootstrap-qualification-private.age; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bootstrap-probe-qualification-${{ github.run_id }}
          path: evidence/bootstrap-probe-qualify.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bootstrap-probe-qualification-private-${{ github.run_id }}
          path: evidence/bootstrap-qualification-private.age
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore
