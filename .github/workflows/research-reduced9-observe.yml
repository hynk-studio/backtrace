name: Reduced nine-slot read-only account observation
on:
  push:
    branches: [bt-001-research-reduced9-observe-20261026-0007]
permissions:
  contents: read
concurrency:
  group: reduced9-observe-20261026-0007
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned read-only query dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Read complete account, exact regional offers and Pods without mutations
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python -m tools.research_entry_offer evidence/account-quote.json
          python -c "import json; r=json.load(open('evidence/account-quote.json')); assert r['status']=='PASS' and r['allocation_requests']==0 and r['settings_changed'] is False"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reduced9-observation-${{ github.run_id }}
          path: evidence/account-quote.json
          retention-days: 14
          if-no-files-found: error
