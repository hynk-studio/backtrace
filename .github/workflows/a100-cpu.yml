name: A100 cloud CPU qualification

on:
  push:
    branches: [bt-001-connected-gpu-smoke, bt-001-bootstrap-diagnostics, bt-001-bootstrap-probe, bt-001-full-path-parity, bt-001-full-setup-cpu, bt-001-qualified-gpu-20261023]
# The owner entry requires a successful suite at its exact source commit,
# including commits that only update qualification/evidence documents.
permissions:
  contents: read

concurrency:
  group: a100-cpu-${{ github.ref }}
  # Preserve a completed test run while provider status updates are delayed.
  cancel-in-progress: false

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Real Linux owner-host checks and full CPU suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python_path="$(command -v python3)"
          sudo "$python_path" -c 'from tools.runpod_job import check_owner_host; check_owner_host()'
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          "$python_path" tools/backtrace.py preflight | tee evidence/preflight.json
          git diff --check
      - name: Real minimal HTTP regression with the deployed dependency subset
        run: |
          python -m venv .local/api-minimal
          .local/api-minimal/bin/python -m pip install --require-hashes --only-binary=:all: -r docs/api-http-minimal.lock
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          from tools.qualify_api import run_checks
          root = Path('.local/api-control').absolute()
          root.mkdir(parents=True)
          old = json.loads(Path('docs/a100-api-runtime-amendment.json').read_text())['original']
          url = 'https://pypi.org/pypi/fastapi/' + old['version'] + '/json'
          release = json.load(urllib.request.urlopen(url, timeout=30))
          match = [r for r in release['urls'] if r['filename'] == old['path']
                   and r['size'] == old['bytes'] and r['digests']['sha256'] == old['sha256']]
          assert len(match) == 1
          wheel = root / old['path']
          with urllib.request.urlopen(match[0]['url'], timeout=30) as response:
              wheel.write_bytes(response.read(old['bytes'] + 1))
          with Path('evidence/api-minimal.log').open('w') as log:
              result = run_checks(Path('.local/api-minimal/bin/python').absolute(),
                  wheel, root / 'result', log, mode='minimal')
          Path('evidence/api-minimal.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Concurrent owner and watcher lifecycle including provider readiness waits
        if: github.ref_name == 'bt-001-bootstrap-diagnostics'
        run: |
          set -euo pipefail
          python_path="$(command -v python3)"
          sudo "$python_path" tests/official_cloud_lifecycle.py --bootstrap-only | tee evidence/lifecycle.json
      - name: Preserve CPU evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a100-cpu-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
