name: Small model ordinary container execution qualification
on:
  push:
    branches: [bt-001-small-model-container-20261027]
permissions:
  contents: read
concurrency:
  group: small-model-container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Full native suite and preflight
        run: |
          set -euo pipefail
          mkdir -p evidence .local
          if ! command -v bwrap >/dev/null; then sudo apt-get update && sudo apt-get install -y bubblewrap; fi
          python_path="$(command -v python3)"
          sudo "$python_path" -m unittest discover -s tests -v > evidence/tests.log 2>&1
          python tools/backtrace.py preflight > evidence/preflight.json
          git diff --check
      - name: Prepare exact CPU owner and CUDA wheel closure
        run: |
          set -euo pipefail
          runtime_root="$(mktemp -d /tmp/backtrace-container-owner-XXXXXX)"
          chmod 755 "$runtime_root"
          python -m venv "$runtime_root"
          echo "BACKTRACE_CPU_RUNTIME=$runtime_root" >> "$GITHUB_ENV"
          "$runtime_root/bin/python" -m pip install --no-cache-dir --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r docs/small-model-cpu-requirements.txt > evidence/owner-install.log 2>&1
          "$runtime_root/bin/python" -m pip check > evidence/owner-pip-check.txt
          python -m pip download --no-cache-dir --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cu126 -r docs/small-model-gpu-requirements.txt -d .local/cuda-wheels > evidence/cuda-download.log 2>&1
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt > evidence/controller-install.log 2>&1
          python - <<'PY'
          from pathlib import Path
          import json
          from tools.cloud_transport import build
          root=Path('.local/transport-build')
          result=build(root)
          (root/'receipt.json').write_text(json.dumps(result,sort_keys=True))
          PY
          df -h . > evidence/disk-before-container.txt
      - name: Reconstruct unchanged inputs and scope
        run: |
          python -m tools.small_model_readiness acquire .local/model-sources > evidence/source-acquisition.json
          python -m tools.small_model_readiness rebuild-packets .local/packets > evidence/packet-reconstruction.json
          HF_HUB_OFFLINE=1 "$BACKTRACE_CPU_RUNTIME/bin/python" -m tools.small_model_readiness tokenize .local/model-sources .local/packets .local/tokenization.json > evidence/tokenization-summary.json
          python -m tools.small_model_readiness prepare-scope .local/packets .local/tokenization.json .local/smoke --scope smoke > evidence/smoke-scope.json
      - name: Install and exercise exact image through authenticated SSH
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID env HF_HUB_OFFLINE=1 TOKENIZERS_PARALLELISM=false "$BACKTRACE_CPU_RUNTIME/bin/python" -m tools.small_model_container_probe .local/model-sources .local/packets .local/tokenization.json .local/smoke .local/cuda-wheels .local/transport-build .local/container-qualification > evidence/container-summary.json 2> evidence/container-stderr.log
      - name: Preserve bounded public CPU evidence
        if: always()
        run: |
          sudo python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.local/container-qualification')
          allowed={'receipt.json','collection.json','evaluation.json','assignment.json','ledger.jsonl','E2B-ready.json','E4B-ready.json','E2B-stderr.log','E4B-stderr.log','boundary.log','deadline.log','transport-loss.log','supervisor-loss.log','image.log','install.log','remote-error.log'}
          for p in root.rglob('*'):
              if p.is_symlink() or 'random-models' in p.parts:continue
              if p.is_file() and p.name in allowed and p.stat().st_size<=16*1024**2:
                  shutil.copyfile(p,Path('evidence')/('container-'+str(p.relative_to(root)).replace('/','-')))
          for p in Path('evidence').iterdir():p.chmod(0o644)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-container-cpu-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
