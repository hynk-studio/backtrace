name: One-case fresh read-only account observation
on:
  push:
    branches: [bt-001-reasoning-onecase-account-20261101]
permissions:
  contents: read
jobs:
  quote:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install existing pinned read-only client
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Refresh account, exact stock and complete inventory without allocation
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python -m tools.small_model_provider evidence/account-quotes.json
      - name: Read only the rejected attempt audit window
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m tools.onecase_provider_audit_readonly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: onecase-fresh-account-${{ github.sha }}
          path: evidence/*.json
          retention-days: 14
