name: E2B sixteen-example trainability diagnostic
on:
  push:
    branches: [bt-001-trainability-20261101, bt-001-trainability-start-20261101]
permissions:
  contents: write
  actions: read
concurrency:
  group: small-e2b-trainability-cpu-${{ github.ref }}
  # Superseded review commits are free replicas. Never cancel a paid start.
  cancel-in-progress: ${{ github.ref_name == 'bt-001-trainability-20261101' }}
jobs:
  container:
    if: github.ref_name != 'bt-001-trainability-start-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Full exact-source native tests and preflight
        if: github.ref_name == 'bt-001-trainability-20261101'
        run: |
          set -euo pipefail
          mkdir -p evidence .local
          if ! command -v bwrap >/dev/null; then sudo apt-get update && sudo apt-get install -y bubblewrap; fi
          sudo "$(command -v python)" -m unittest discover -s tests -v > evidence/tests.log 2>&1
          python tools/backtrace.py preflight > evidence/preflight.json
          git diff --check
      - name: Prepare pinned CUDA wheels and transport before any allocation
        run: |
          mkdir -p evidence .local
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
          if [ "$GITHUB_REF_NAME" = bt-001-trainability-20261101 ]; then
            python -m pip download --no-cache-dir --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cu126 -r docs/small-model-gpu-requirements.txt -d .local/cuda-wheels
          fi
          python - <<'PYBUILD'
          from pathlib import Path
          import json
          from tools.cloud_transport import build
          root=Path('.local/transport-build');result=build(root)
          (root/'receipt.json').write_text(json.dumps(result,sort_keys=True))
          PYBUILD
      - name: Compare SSH receive windows under identical free imposed latency
        run: |
          sudo "$(command -v python)" tests/small_model_transport_control.py .local/transport-build/dropbear-DROPBEAR_2026.94/dropbear .local/transport-build/dropbear-DROPBEAR_2026.94/dropbearkey actions-20261019 --window-control > evidence/transport-window-control.json 2> evidence/transport-window-control.log
      - name: Exercise the exact hardware entry in a free ordinary container
        if: github.ref_name == 'bt-001-trainability-20261101'
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID "$(command -v python)" -m tools.small_model_trainability_scope qualify .local/cuda-wheels .local/transport-build .local/minimum-qualification > evidence/container.json 2> evidence/container-stderr.log
      - name: Preserve bounded qualification evidence
        if: always()
        run: |
          sudo python - <<'PYSAVE'
          from pathlib import Path
          import shutil
          root=Path('.local/minimum-qualification')
          for p in root.rglob('*'):
              if p.is_file() and not p.is_symlink() and p.suffix in ('.json','.log') and p.stat().st_size<16*1024**2:
                  shutil.copyfile(p,Path('evidence')/('container-'+str(p.relative_to(root)).replace('/','-')))
          for p in Path('evidence').iterdir():p.chmod(0o644)
          PYSAVE
      - name: Emit bounded evidence archive for durable review
        if: always()
        run: |
          python - <<'PYARCHIVE'
          from pathlib import Path
          import base64,hashlib,io,json,zipfile
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(Path('evidence').rglob('*')):
                  if (p.is_file() and not p.is_symlink() and p.suffix in ('.json','.jsonl','.log')
                          and p.name not in ('endpoint.json','collector-input.json') and p.stat().st_size<=16*1024**2):
                      archive.write(p,p.relative_to('evidence').as_posix())
          raw=stream.getvalue()
          if len(raw)>8*1024**2:raise ValueError('evidence archive exceeds bound')
          encoded=base64.b64encode(raw).decode()
          print('TRAINABILITY_ARCHIVE_META '+json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
          for i in range(0,len(encoded),48000):print('TRAINABILITY_ARCHIVE_CHUNK '+str(i//48000)+' '+encoded[i:i+48000])
          PYARCHIVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-e2b-trainability-container-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned owner controller dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Prepare pinned CUDA wheels and transport before any allocation
        if: github.ref_name == 'bt-001-trainability-start-20261101'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
          python -m pip download --no-cache-dir --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cu126 -r docs/small-model-gpu-requirements.txt -d .local/cuda-wheels
          python - <<'PYBUILD'
          from pathlib import Path
          import json
          from tools.cloud_transport import build
          root=Path('.local/transport-build');result=build(root)
          (root/'receipt.json').write_text(json.dumps(result,sort_keys=True))
          PYBUILD
      - name: Prepare checkpoint, two adapters and all48 train-only assignments before allocation
        if: github.ref_name == 'bt-001-trainability-start-20261101'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence .local
          gh api /repos/hynk-studio/backtrace/actions/artifacts/12640353622/zip > .local/readiness.zip
          python -m tools.small_model_pretrained prepare .local/e2b .local/readiness.zip > evidence/preparation.json
          python -m venv .local/model-runtime
          .local/model-runtime/bin/python -m pip install --no-index --no-deps --only-binary=:all: --require-hashes --find-links .local/cuda-wheels -r docs/small-model-gpu-requirements.txt
          .local/model-runtime/bin/python -m tools.small_model_gpu check-runtime > evidence/owner-runtime.json
          .local/model-runtime/bin/python -m tools.small_model_trainability plan-gpu-inputs .local/e2b > evidence/assignment-before-allocation.json
      - name: Run bounded scope (free replica or authorized sixteen-example diagnostic)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          mode=free
          if [ "$GITHUB_REF_NAME" = bt-001-trainability-start-20261101 ]; then mode=paid; fi
          python -m tools.small_model_trainability_scope owner "$mode"
      - name: Preserve current account and quotes (read only)
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m tools.small_model_provider evidence/account-after.json
      - name: Preserve original collector checkpoints after interruption
        if: always()
        run: python -m tools.small_model_trainability preserve evidence/minimum-owner/remote
      - name: Emit bounded evidence archive for durable review
        if: always()
        run: |
          python - <<'PYARCHIVE'
          from pathlib import Path
          import base64,hashlib,io,json,zipfile
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(Path('evidence').rglob('*')):
                  if (p.is_file() and not p.is_symlink() and p.suffix in ('.json','.jsonl','.log')
                          and p.name not in ('endpoint.json','collector-input.json') and p.stat().st_size<=16*1024**2):
                      archive.write(p,p.relative_to('evidence').as_posix())
          raw=stream.getvalue()
          if len(raw)>8*1024**2:raise ValueError('evidence archive exceeds bound')
          encoded=base64.b64encode(raw).decode()
          print('TRAINABILITY_ARCHIVE_META '+json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
          for i in range(0,len(encoded),48000):print('TRAINABILITY_ARCHIVE_CHUNK '+str(i//48000)+' '+encoded[i:i+48000])
          PYARCHIVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-e2b-trainability-cpu-owner-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**/*.json
            evidence/**/*.jsonl
            evidence/**/*.log
            !evidence/**/endpoint.json
            !evidence/**/collector-input.json
          retention-days: 14
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Run bounded scope (free replica or authorized sixteen-example diagnostic)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          mode=free
          if [ "$GITHUB_REF_NAME" = bt-001-trainability-start-20261101 ]; then mode=paid; fi
          python -m tools.small_model_trainability_scope watch "$mode"
      - name: Emit bounded evidence archive for durable review
        if: always()
        run: |
          python - <<'PYARCHIVE'
          from pathlib import Path
          import base64,hashlib,io,json,zipfile
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(Path('evidence').rglob('*')):
                  if (p.is_file() and not p.is_symlink() and p.suffix in ('.json','.jsonl','.log')
                          and p.name not in ('endpoint.json','collector-input.json') and p.stat().st_size<=16*1024**2):
                      archive.write(p,p.relative_to('evidence').as_posix())
          raw=stream.getvalue()
          if len(raw)>8*1024**2:raise ValueError('evidence archive exceeds bound')
          encoded=base64.b64encode(raw).decode()
          print('TRAINABILITY_ARCHIVE_META '+json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
          for i in range(0,len(encoded),48000):print('TRAINABILITY_ARCHIVE_CHUNK '+str(i//48000)+' '+encoded[i:i+48000])
          PYARCHIVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-e2b-trainability-cpu-watch-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**/*.json
            evidence/**/*.log
            !evidence/**/endpoint.json
          retention-days: 14

  prepare:
    if: github.ref_name == 'bt-001-trainability-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Reuse exact historical tokenization and verify full E2B bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local evidence
          gh api /repos/hynk-studio/backtrace/actions/artifacts/12640353622/zip > .local/readiness.zip
          python -m tools.small_model_pretrained prepare .local/e2b .local/readiness.zip > evidence/preparation.json 2> evidence/preparation.log
      - name: Qualify full targets and all48 train-only inputs with the pinned tokenizer
        run: |
          python -m venv .local/runtime
          .local/runtime/bin/python -m pip download --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r docs/small-model-cpu-requirements.txt -d .local/wheels > evidence/dependency-download.log 2>&1
          .local/runtime/bin/python -m pip install --no-index --find-links .local/wheels --require-hashes -r docs/small-model-cpu-requirements.txt > evidence/dependency-install.log 2>&1
          .local/runtime/bin/python -m tools.small_model_trainability inspect-inputs .local/e2b > evidence/input-verification.json
          cat evidence/input-verification.json
      - name: Emit bounded evidence archive for durable review
        if: always()
        run: |
          python - <<'PYARCHIVE'
          from pathlib import Path
          import base64,hashlib,io,json,zipfile
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(Path('evidence').rglob('*')):
                  if (p.is_file() and not p.is_symlink() and p.suffix in ('.json','.jsonl','.log')
                          and p.name not in ('endpoint.json','collector-input.json') and p.stat().st_size<=16*1024**2):
                      archive.write(p,p.relative_to('evidence').as_posix())
          raw=stream.getvalue()
          if len(raw)>8*1024**2:raise ValueError('evidence archive exceeds bound')
          encoded=base64.b64encode(raw).decode()
          print('TRAINABILITY_ARCHIVE_META '+json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
          for i in range(0,len(encoded),48000):print('TRAINABILITY_ARCHIVE_CHUNK '+str(i//48000)+' '+encoded[i:i+48000])
          PYARCHIVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2b-trainability-inputs-${{ github.sha }}
          path: evidence/
          retention-days: 14
