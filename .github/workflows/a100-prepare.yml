name: A100 free private-input qualification
# CPU qualification includes the actual pinned deployment image and concurrent controllers.

on:
  push:
    branches: [bt-001-api-readiness-recovery, bt-001-connected-qualification]
    paths:
      - 'tools/a100_task.py'
      - 'tools/startup_guard.py'
      - 'tools/api_probe.py'
      - 'tools/qualify_api.py'
      - 'tools/serving_contract.py'
      - 'tools/task_results.py'
      - 'tools/cloud_task.py'
      - 'tests/official_connected_task.py'
      - 'docs/a100-api-runtime-amendment.json'
      - 'docs/linux-supplemental.lock'
      - 'docs/linux-wheel-manifest.json'
      - 'tests/test_api_readiness.py'
      - 'tools/a100_driver.py'
      - 'tools/cloud_prepare.py'
      - 'tools/cloud_image.py'
      - 'tools/cloud_owner.py'
      - 'tools/cloud_watch.py'
      - 'tools/cloud_qualification.py'
      - 'tools/pod_preflight.py'
      - 'tools/pod_bootstrap.py'
      - 'tools/pod_system.py'
      - 'docs/a100-system-packages.json'
      - 'tools/cloud_state.py'
      - 'tools/cloud_resolver.py'
      - 'tools/cloud_reference.py'
      - 'tools/direct_delivery.py'
      - 'tools/ssh_bootstrap.py'
      - 'tools/cloud_transport.py'
      - 'tools/cloud_seal.py'
      - 'tools/cloud_worker.py'
      - 'docs/cloud-controller-requirements.txt'
      - 'tests/official_a100_task.py'
      - 'tests/official_cloud_transport.py'
      - 'tests/official_cloud_prerequisites.py'
      - 'tests/official_cloud_image.py'
      - 'tests/official_cloud_lifecycle.py'
      - 'tests/test_cloud_state.py'
      - 'tests/test_cloud_owner.py'
      - 'tests/test_runpod_control.py'
      - '.github/workflows/a100-prepare.yml'
permissions:
  contents: write
concurrency:
  group: a100-free-input-qualification
  # This workflow has no paid path. Each handoff has a unique run/source namespace.
  # Superseded CPU preparation cannot qualify the newer files or allocate a Pod.
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Prepare disk on this disposable CPU runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: Install separately pinned controller SDK
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Qualify exact private inputs without GPU or model execution
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.cloud_prepare
      - name: Preserve projected metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a100-free-prepare-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/cloud-prepare.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve encrypted private evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a100-private-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/cloud-private.age
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
