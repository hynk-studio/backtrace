name: Small model CUDA build and baseline preparation qualification

on:
  push:
    branches: [bt-001-small-model-gpu-20261026]

permissions:
  contents: read

concurrency:
  group: small-model-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check native namespace boundary before expensive preparation
        run: |
          mkdir -p evidence .local
          if ! command -v bwrap >/dev/null; then sudo apt-get update && sudo apt-get install -y bubblewrap; fi
          python_path="$(command -v python3)"
          runtime_root="$(mktemp -d /tmp/backtrace-cpu-runtime-XXXXXX)"
          chmod 755 "$runtime_root"
          "$python_path" -m venv "$runtime_root"
          echo "BACKTRACE_CPU_RUNTIME=$runtime_root" >> "$GITHUB_ENV"
          sudo "$python_path" - "$runtime_root/bin/python" <<'PY' > evidence/early-boundary.json 2> evidence/early-boundary-stderr.log
          import json,sys
          from pathlib import Path
          from tools.small_model_runner_probe import boundary_probe
          root=Path('.local/runner-early').resolve(); root.mkdir(mode=0o700)
          for kind in ('sources','models'):
              (root/kind/'E2B').mkdir(mode=0o700,parents=True)
          print(json.dumps(boundary_probe(Path(sys.argv[1]),root/'sources',root/'models',root/'boundaries'),sort_keys=True))
          PY
      - name: Full native Linux suite and CPU preflight
        run: |
          set -euo pipefail
          mkdir -p evidence .local
          python_path="$(command -v python3)"
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          "$python_path" tools/backtrace.py preflight | tee evidence/preflight.json
          git diff --check
      - name: Install pinned CPU runtime and record isolation tool
        run: |
          sudo apt-get update > evidence/os-install.log 2>&1
          sudo apt-get install -y bubblewrap >> evidence/os-install.log 2>&1
          bwrap --version > evidence/bubblewrap-version.txt
          "$BACKTRACE_CPU_RUNTIME/bin/python" -m pip download --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r docs/small-model-cpu-requirements.txt -d .local/wheels > evidence/dependency-download.log 2>&1
          "$BACKTRACE_CPU_RUNTIME/bin/python" -m pip install --no-index --find-links .local/wheels --require-hashes -r docs/small-model-cpu-requirements.txt > evidence/dependency-install.log 2>&1
          "$BACKTRACE_CPU_RUNTIME/bin/python" -m pip check > evidence/dependency-check.txt
      - name: Reconstruct and verify original development inputs
        run: |
          python -m tools.small_model_readiness acquire .local/model-sources > evidence/source-acquisition.json
          python -m tools.small_model_readiness rebuild-packets .local/packets > evidence/packet-reconstruction.json
          HF_HUB_OFFLINE=1 "$BACKTRACE_CPU_RUNTIME/bin/python" -m tools.small_model_readiness tokenize .local/model-sources .local/packets .local/tokenization.json > evidence/tokenization-summary.json
          python -m tools.small_model_readiness prepare-scope .local/packets .local/tokenization.json .local/smoke --scope smoke > evidence/smoke-scope.json
      - name: Actual isolated random-model and authored-control path
        run: |
          runtime_python="$BACKTRACE_CPU_RUNTIME/bin/python"
          sudo env HF_HUB_OFFLINE=1 TOKENIZERS_PARALLELISM=false "$runtime_python" -m tools.small_model_runner_probe .local/model-sources .local/packets .local/tokenization.json .local/smoke .local/runner-qualification > evidence/runner-summary.json 2> evidence/runner-stderr.log
      - name: Install and verify exact CUDA build on free CPU
        run: |
          set -euo pipefail
          gpu_runtime="$(mktemp -d /tmp/backtrace-cuda-runtime-XXXXXX)"
          chmod 755 "$gpu_runtime"
          python -m venv "$gpu_runtime"
          echo "BACKTRACE_CUDA_RUNTIME=$gpu_runtime" >> "$GITHUB_ENV"
          df -h . > evidence/disk-before-cuda.txt
          "$gpu_runtime/bin/python" -m pip download --no-cache-dir --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cu126 -r docs/small-model-gpu-requirements.txt -d .local/cuda-wheels > evidence/cuda-download.log 2>&1
          python -m tools.small_model_gpu verify-wheels .local/cuda-wheels > evidence/cuda-wheels.json
          "$gpu_runtime/bin/python" -m pip install --no-cache-dir --no-index --find-links .local/cuda-wheels --require-hashes -r docs/small-model-gpu-requirements.txt > evidence/cuda-install.log 2>&1
          "$gpu_runtime/bin/python" -m pip check > evidence/cuda-dependency-check.txt
          HF_HUB_OFFLINE=1 "$gpu_runtime/bin/python" -m tools.small_model_gpu check-runtime > evidence/cuda-runtime.json 2> evidence/cuda-runtime-stderr.log
      - name: CUDA build CPU controls and missing-GPU rejection
        run: |
          sudo env HF_HUB_OFFLINE=1 TOKENIZERS_PARALLELISM=false "$BACKTRACE_CUDA_RUNTIME/bin/python" -m tools.small_model_gpu_probe .local/model-sources .local/packets .local/tokenization.json .local/smoke .local/gpu-qualification > evidence/gpu-preparation-summary.json 2> evidence/gpu-preparation-stderr.log
      - name: Preserve bounded results without inputs or model weights
        if: always()
        run: |
          sudo python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.local/runner-qualification')
          for name in ('receipt.json','failed.json'):
              if (root/name).is_file(): shutil.copyfile(root/name,Path('evidence')/('runner-'+name))
          for p in [root/'parent-loss-coordinator.log',*root.glob('boundaries/*.log'),*root.glob('boundaries/*/facts.json')]:
              if p.is_file() and p.stat().st_size<=1024*1024:
                  shutil.copyfile(p,Path('evidence')/('diagnostic-'+str(p.relative_to(root)).replace('/','-')))
          early=Path('.local/runner-early')
          for p in [*early.glob('boundaries/*.log'),*early.glob('boundaries/*/facts.json')]:
              if p.is_file() and p.stat().st_size<=1024*1024:
                  shutil.copyfile(p,Path('evidence')/('early-diagnostic-'+str(p.relative_to(early)).replace('/','-')))
          for name in ('oracle','tool_boundary','hang','crash','wrong_id','oversize','startup_hang','random','parent-loss'):
              for leaf in ('collection.json','recovery.json','evaluation.json','ledger.jsonl','E2B-stderr.log','E4B-stderr.log','E2B-ready.json','E4B-ready.json'):
                  p=root/name/leaf
                  if p.is_file() and p.stat().st_size<=16*1024*1024:
                      shutil.copyfile(p,Path('evidence')/(name+'-'+leaf))
          gpu=Path('.local/gpu-qualification')
          allowed={'receipt.json','baseline-plan.json','character-bind.json','char-stderr.log','no-gpu-stderr.log',
                   'assignment.json','collection.json','ledger.jsonl','evaluation.json','E2B-ready.json','E4B-ready.json',
                   'E2B-stderr.log','E4B-stderr.log','facts.json','deadline.log','parent_loss.log'}
          for p in gpu.rglob('*'):
              if p.is_file() and p.name in allowed and p.stat().st_size<=16*1024*1024 and 'random-models' not in p.parts:
                  shutil.copyfile(p,Path('evidence')/('gpu-'+str(p.relative_to(gpu)).replace('/','-')))
          for p in Path('evidence').iterdir(): p.chmod(0o644)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-model-gpu-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
