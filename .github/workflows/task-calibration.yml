name: Free five-minute task and search calibration
on:
  push:
    branches: [bt-001-task-calibration-20261023]
    paths: ['tools/**', 'tests/**', '.github/workflows/task-calibration.yml']
permissions:
  contents: write
concurrency:
  group: free-task-calibration-20261023
  cancel-in-progress: true
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Actual Linux full suite and CPU preflight
        run: |
          set -euo pipefail
          mkdir -p evidence
          python_path="$(command -v python)"
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          python tools/backtrace.py preflight | tee evidence/preflight.json
          git diff --check
      - name: Free disposable CPU disk preparation
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install pinned input-resolution and encryption libraries
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Full actual SSH setup, host and offline-image task calibration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -m tools.cloud_prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-calibration-public-${{ github.run_id }}
          path: |
            evidence/cloud-prepare.json
            evidence/cpu-tests.log
            evidence/preflight.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-calibration-private-${{ github.run_id }}
          path: evidence/cloud-private.age
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
