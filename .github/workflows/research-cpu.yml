name: Matched comparison and exact teacher CPU preparation

on:
  push:
    branches: [bt-001-research-prep-20261024]

permissions:
  contents: read

concurrency:
  group: research-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    if: github.repository == 'hynk-studio/backtrace'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Full Linux CPU suite and preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          mkdir -p .local
          chmod 700 .local
          python_path="$(command -v python3)"
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          "$python_path" tools/backtrace.py preflight | tee evidence/preflight.json
          "$python_path" -m tools.research_comparison validate | tee evidence/protocol-validation.json
          git diff --check
      - name: Generate exact teacher on CPU
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.exact_teacher generate .local/research-teacher --variants-per-family 8
          cp .local/research-teacher/manifest.json evidence/teacher-manifest.json
      - name: Install the existing pinned input-resolution SDK
        run: python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Select original public IDs and reconstruct matched candidates
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -m tools.research_cpu evidence/research-inputs.json
      - name: Preserve public receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-cpu-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
