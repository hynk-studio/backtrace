name: A100 one bootstrap diagnostic allocation
on:
  push:
    branches: [bt-001-a100-start-bootstrap-probe]
permissions:
  contents: write
  actions: read
concurrency:
  group: a100-owner-bootstrap-probe-20261022
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Execute only the qualified one-allocation bootstrap experiment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_TOKEN,RUNPOD_API_KEY,GITHUB_REPOSITORY,GITHUB_REF_NAME,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_SHA "$python_path" -m tools.bootstrap_probe paid
      - name: Make only projected report and encrypted evidence readable
        if: always()
        run: |
          if test -d evidence; then sudo chmod 0755 evidence; fi
          for file in evidence/bootstrap-probe-paid.json evidence/bootstrap-probe-private.age; do
            if sudo test -f "$file"; then sudo chmod 0644 "$file"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bootstrap-probe-public-${{ github.run_id }}
          path: evidence/bootstrap-probe-paid.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bootstrap-probe-private-${{ github.run_id }}
          path: evidence/bootstrap-probe-private.age
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore
