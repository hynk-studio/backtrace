name: Small model hardware minimum retry live
on:
  push:
    branches: [bt-001-small-model-minimum-retry-start-20261027]
permissions:
  contents: write
  actions: read
concurrency:
  group: small-minimum-retry-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Prepare pinned CUDA wheels and transport before any allocation
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
          python -m pip download --no-cache-dir --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cu126 -r docs/small-model-gpu-requirements.txt -d .local/cuda-wheels
          python - <<'PYBUILD'
          from pathlib import Path
          import json
          from tools.cloud_transport import build
          root=Path('.local/transport-build');result=build(root)
          (root/'receipt.json').write_text(json.dumps(result,sort_keys=True))
          PYBUILD
      - name: Execute authorized hardware-only scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m tools.small_model_minimum_retry owner paid
      - name: Retain bounded hardware receipts and refresh final account observation
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python -m tools.small_model_provider evidence/account-after.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-minimum-retry-live-owner-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**/*.json
            evidence/**/*.log
            !evidence/**/endpoint.json
          retention-days: 14
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Execute authorized hardware-only scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m tools.small_model_minimum_retry watch paid
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-minimum-retry-live-watch-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**/*.json
            evidence/**/*.log
            !evidence/**/endpoint.json
          retention-days: 14
