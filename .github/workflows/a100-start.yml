name: Qualified A100 free owner preparation

on:
  push:
    branches: [bt-001-qualified-gpu-20261023]
    paths: ['docs/qualified-gpu-actions-qualification-20261023.json']
    # Only a new recorded qualification receipt starts this free preparation.
    # The paid branch uses its separately bound single-attempt workflow.

permissions:
  contents: write
  actions: read
concurrency:
  group: a100-owner-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install separately pinned owner SDK
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Prepare freely or execute the dedicated single-attempt entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          LAUNCH_MODE: preflight
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_TOKEN,RUNPOD_API_KEY,KAGGLE_API_TOKEN,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF_NAME "$python_path" -m tools.cloud_launch --mode "$LAUNCH_MODE"
      - name: Make only projected metadata and ciphertext readable to artifact uploader
        if: always()
        run: |
          if test -d evidence; then sudo chmod 0755 evidence; fi
          for result in evidence/a100-owner.json evidence/a100-owner-private.age; do
            if sudo test -f "$result"; then sudo chmod 0644 "$result"; fi
          done
      - name: Retain projected owner result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a100-owner-${{ github.run_id }}
          path: evidence/a100-owner.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain encrypted private receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a100-owner-private-${{ github.run_id }}
          path: evidence/a100-owner-private.age
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
