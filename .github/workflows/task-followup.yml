name: Recovered task free CPU verification and budget analysis
on:
  push:
    branches: [bt-001-task-budget-evaluation-20261023]
    paths:
      - 'tools/recovered_task.py'
      - 'tools/task_budget.py'
      - 'tools/task_followup.py'
      - 'tools/qualify_evaluation.py'
      - 'tests/official_task_followup.py'
      - 'tests/test_task_followup.py'
      - 'docs/task-followup-input-20261023.json'
      - '.github/workflows/task-followup.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: recovered-task-followup-20261023
  # Only this free CPU probe may be superseded; paid/watch workflows are separate.
  cancel-in-progress: true
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Actual Linux full suite and CPU preflight
        run: |
          set -euo pipefail
          mkdir -p evidence
          python_path="$(command -v python)"
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          python tools/backtrace.py preflight | tee evidence/preflight.json
          git diff --check
      - name: Free disposable CPU disk preparation
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install pinned owner input-resolution and encryption SDK only
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Verify original partial patch on CPU after confirmed provider deletion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_TOKEN,KAGGLE_API_TOKEN,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF_NAME "$python_path" -m tools.task_followup
      - name: Expose only public metadata and owner ciphertext to uploader
        if: always()
        run: |
          if test -d evidence; then sudo chmod 0755 evidence; fi
          for result in evidence/task-followup.json evidence/task-followup.age; do
            if sudo test -f "$result"; then sudo chmod 0644 "$result"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-followup-public-${{ github.run_id }}
          path: |
            evidence/task-followup.json
            evidence/cpu-tests.log
            evidence/preflight.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-followup-private-${{ github.run_id }}
          path: evidence/task-followup.age
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
