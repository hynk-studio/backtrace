name: R1 v2 recovered patch free public verification
on:
  push:
    branches: [bt-001-verified-evaluation-20261024]
    paths: ['tools/verified_evaluation.py', '.github/workflows/verified-evaluation.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-public-evaluation-20261024
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Actual Linux full suite and preflight
        run: |
          set -euo pipefail
          mkdir -p evidence
          python_path="$(command -v python)"
          sudo "$python_path" -m unittest discover -s tests -v 2>&1 | tee evidence/cpu-tests.log
          python tools/backtrace.py preflight | tee evidence/preflight.json
          git diff --check
      - name: Prepare free disposable CPU disk and pinned resolver
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Warm frozen CPU runtime and verify original patch after confirmed deletion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=GITHUB_TOKEN,KAGGLE_API_TOKEN,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY,GITHUB_REF_NAME "$python_path" -m tools.verified_evaluation
      - name: Expose only projected result and owner ciphertext
        if: always()
        run: |
          if test -d evidence; then sudo chmod 0755 evidence; fi
          for result in evidence/verified-evaluation.json evidence/verified-evaluation.age; do
            if sudo test -f "$result"; then sudo chmod 0644 "$result"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-evaluation-public-${{ github.run_id }}
          path: |
            evidence/verified-evaluation.json
            evidence/cpu-tests.log
            evidence/preflight.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-evaluation-private-${{ github.run_id }}
          path: evidence/verified-evaluation.age
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
