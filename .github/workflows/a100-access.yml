name: A100 read-only credential check

on:
  push:
    branches: [bt-001-a100-cpu-qualification]
    paths:
      - 'tools/cloud_probe.py'
      - 'docs/cloud-controller-requirements.txt'
      - '.github/workflows/a100-access.yml'
permissions:
  contents: read

concurrency:
  group: a100-access-check
  cancel-in-progress: false

jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install separately pinned owner-side SDK
        run: python -m pip install --require-hashes --only-binary=:all: -r docs/cloud-controller-requirements.txt
      - name: Read-only provider and exact small-input checks
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -m tools.cloud_probe
