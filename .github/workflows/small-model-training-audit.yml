name: E2B training path audit (CPU only)
on:
  push:
    branches: [bt-001-training-path-audit-20261101]
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/small-model-training-audit.yml'
permissions:
  contents: read
concurrency:
  group: training-path-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check full target boundaries and analytic teacher witnesses
        run: |
          mkdir -p evidence .local/tokenizer
          python -m unittest tests.test_small_model_sft_inputs tests.test_small_model_matched_data tests.test_exact_teacher.ExactProbabilityTests tests.test_exact_teacher.ExactDecisionTests tests.test_exact_teacher.TeacherValidationTests tests.test_abductive_benchmark.AnalyticScoringTests tests.test_abductive_benchmark.AbductionAndTimeTests tests.test_temporal_baseline.TemporalAnalyticTests -v > evidence/tests.log 2>&1
          git diff --check
      - name: Install the existing pinned CPU runtime
        run: |
          python -m pip install --only-binary=:all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r docs/small-model-cpu-requirements.txt > evidence/runtime-install.log 2>&1
      - name: Fetch only pinned E2B tokenizer and metadata bytes
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          from tools import small_model_readiness as ready
          root = Path('.local/tokenizer')
          for name, info in ready.lock()['models']['E2B']['files'].items():
              with urllib.request.urlopen(info['url'], timeout=45) as response:
                  raw = response.read(info['bytes'] + 1)
              (root/name).write_bytes(raw)
              ready.checked_file(root/name, info)
          PY
      - name: Audit all 640 targets, historical token identities, and causal loss
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m tools.small_model_training_audit --tokenizer .local/tokenizer > evidence/training-path-audit.json
          cat evidence/training-path-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: training-path-audit-${{ github.sha }}
          path: evidence/
          retention-days: 14
